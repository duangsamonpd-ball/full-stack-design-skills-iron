name: drift

# The gates run on push, because a push is when they can break. These halves are
# different: nothing in this repo changes when a dependency ships a major, an
# advisory is disclosed, Node 24 enters maintenance, or WCAG 3.0 becomes the REC.
# They drift on the world's clock, so they need a clock, not a commit.
#
# Note: GitHub disables scheduled workflows after 60 days without repo activity,
# and mails the owner when it does. Re-enable from the Actions tab.

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC — off the hour, where the queue is shortest
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: drift
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      # Only the check deps. `npm audit` reads the lockfile, so the Astro
      # workspace is audited without installing it.
      - name: Install check deps
        working-directory: scripts
        run: npm ci

      - name: Radar
        id: radar
        run: |
          set +e
          node scripts/check-drift.mjs --versions --audit --fail-on-drift > drift.txt 2>&1
          echo "drift=$?" >> "$GITHUB_OUTPUT"
          cat drift.txt

      - name: Open or update the drift issue
        if: steps.radar.outputs.drift != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create drift --description "Reported by the scheduled drift radar" --color FBCA04 --force
          number=$(gh issue list --state open --label drift --json number --jq '.[0].number // empty')
          {
            echo "The scheduled radar found something that moved. Run \`npm run drift\` in \`scripts/\` locally to reproduce."
            echo
            echo '```'
            cat drift.txt
            echo '```'
            echo
            echo "— [run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) · $(date -u '+%Y-%m-%d')"
          } > body.md
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --label drift --title "drift: something the radar tracks has moved" --body-file body.md
          fi

      # Close the loop, so a stale open issue never outlives the drift it reported.
      - name: Close the drift issue once clean
        if: steps.radar.outputs.drift == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --state open --label drift --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "Radar is clean again as of $(date -u '+%Y-%m-%d'). Closing."
          fi
